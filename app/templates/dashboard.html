<!doctype html>
<html>
<head>
    <title>DV8 Network Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h1>Network Metrics</h1>
<p>Average latency: {{ data.avg_latency }} ms</p>
<canvas id="latencyChart" width="400" height="200"></canvas>
<h2>Register Sandbox Device</h2>
<form id="deviceForm">
    <input name="name" placeholder="Name" required>
    <input name="device_type" placeholder="Type" required>
    <input name="ports" type="number" min="1" value="1" required>
    <button type="submit">Add</button>
</form>
<div id="deviceResult"></div>

<script>
const ctx = document.getElementById('latencyChart').getContext('2d');
const labels = {{ data.devices | map(attribute='device') | list | safe }};
const latencies = {{ data.devices | map(attribute='latency_ms') | list | safe }};
new Chart(ctx, {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [{
            label: 'Latency (ms)',
            data: latencies,
            backgroundColor: 'rgba(54, 162, 235, 0.5)',
        }]
    }
});

const form = document.getElementById('deviceForm');
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const payload = {
        name: fd.get('name'),
        device_type: fd.get('device_type'),
        ports: parseInt(fd.get('ports'))
    };
    const resp = await fetch('/sandbox/device', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    const data = await resp.json();
    document.getElementById('deviceResult').textContent = `Registered ${data.name} (${data.device_type})`;
    form.reset();
});
</script>
</body>
</html>
